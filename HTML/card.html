<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }
        .card img{
            width:100%;
            border: 2px dotted black;
            border-radius:10px;
        }

        .card {
            text-align: center;
            background-color: white;
            width: 350px;
            border: 2px solid black;
            padding: 10px;
            border-radius: 15px;
             margin:20px auto;
        }

        .tags span {
            margin: 10px;
            border: 2px dotted blue;
            padding:5px 10px;
            border-radius: 3px;
        }

        .card h1 {
            font-size:30px;
            margin-top:5px;
            margin-bottom:3px;
           
        }
        .card p{
            color:grey;
            font-size:20px;
            line-height:1.5;
            margin-top:12px;
        }
        .card button {
            color: red;
            background-color:#dbeafe;
            border:none;
            padding:10px 20px;
            font-weight:bold;
            cursor:pointer;
            text-align: center;
        }
        .button-container{
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="Screenshot 2026-09-02 150200.png" alt="img">
        <div class="tags">
            <span>Nature</span>
            <span>Lakes</span>
        </div>
        <h1>Lorem, ipsum dolor.</h1>
        <p>
            Lorem ipsum, dolor sit amet consectetur adipisicing elit. Vitae amet qui est necessitatibus ipsa porro,
            repellendus possimus, a minima molestiae nihil deleniti. Sapiente.
        </p>
        <button class="button-container">Read more</button>
    </div>
</body>
</html>
