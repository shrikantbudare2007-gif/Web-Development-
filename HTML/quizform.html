<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html forms-Quiz</title>
</head>

<body>
    <form action="submit.php" method="POSt">
        <h1>This is my first Quiz</h1>
        <div>
            <label for="name">Enter Username</label>
            <input type="text" name="username" id="name" placeholder="enter your name" required>

        </div>
        <div>
            <label for="cityname">Enter your city name</label>
            <input type="text" name="city" id="cityname" placeholder="city name">

        </div>
        <div>
            <label for="pincode">Enter your city pin</label>
            <input type="tel" name="pin" id="pincode" placeholder="enter your city pincode" required>
        </div>
        <div>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </div>
    </form>
</body>

</html>
