<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css card</title>
    <style>
        .card{
            margin:300px auto;
            display:flex;
            justify-content: center;
            gap:20px;
            padding:20px;
            flex-wrap:wrap;
            border:2px solid pink
        }
        .cardsx{
            border:2px solid black;
            width:200px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="cardsx">cards 1</div>
        <div class="cardsx">cards 2</div>
        <div class="cardsx">cards 3</div>
    </div>
</body>
</html>
