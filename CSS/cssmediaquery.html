<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css meia Query</title>
    <style>
        body {
            background-color: red;
            ;
        }

        .boxes {
            display: flex;
        }

        .box {
            width: 344px;
            height: 344px;
            background-color: steelblue;
            border: 2px dotted green;
            margin: 3px;
            padding: 3px;
        }

        @media screen and (orientation:portrait) {
            body {
                border: 2px solid pink;
            }
        }

        @media only screen and (max-width:345px) {
            body {
                background-color: green;
            }

            .boxes {
                flex-direction: column;
            }

        }
    </style>
</head>

<body>
    <div>
        This is a red color div ele
    </div>
    <div class="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

</body>

</html>
