<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css display</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        div.red{
            background-color:lightblue;
            border:2px black;
            display:inline;
        }
        .pil{
            background-color:lightblue;
            border:2px black;
        }
        span{
            box-sizing: border-box;
            /* display:none; */
            visibility: hidden;
            padding:25px;
            margin:2px;
            /* height:100px;
            width:50px; */
            background-color:lightgreen;
            border:2px solid red;
        }
        h4{
            background-color:violet;
            display:inline-block;
            border:2px dotted pink;
            margin:25px;
            /* padding:50px; */
            /* height:100px;
            width:50px; */
        }
    </style>
</head>
<body>
    <div class="red">
        i am good to go
    </div>
    <div class="pil">
        i am here to compete to myself
    </div>
    <span>
        i am done
    </span>
    <h4>
        lets start
    </h4>
</body>
</html>
