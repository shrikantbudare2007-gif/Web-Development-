<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Css Selectors</title>
    <style>
        /* Element Selector */
        /* div{
            color:blue;
        }
        Class Selector
        .red{

        } */
        /* Id selector */
        /* #u234{
            background-color:green;
        } */
         /* Child selector */
         /* div > p{
            color:aquamarine;
            background-color:blueviolet;
         } */
         /* Decendant Selector */
         div p{
            color:purple;
         }
         /* Universal Selector */
         *{
           margin:0;
           padding:0; 
         }
         /* Pseudo Selector */
         a:visited{
            color:pink;
         }
         a:link{
            color:seagreen;
         }
         a:active{
            background-color:rgb(127, 187, 68);
         }
         a:hover{
            background-color:brown;
         }
    </style>
</head>
<body>
    <div id="u234"   class="red">
        i am shrikant
        <article>
         <p>
            i am para
         </p>
        </article>
    </div>
    <div>

    </div>
    <a href="https://www.google.com">Go to Google</a>
</body>
